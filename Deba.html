<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="deba.css">

    <title>Garage Slider</title>
</head>

<body>

    <div id="garageSlider" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="3000">

        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="./Assets/7ab842889e2fce6e0e3515c3ccaaef29x.jpg" class="d-block w-100 slider-img">

                <div class="overlay"></div>

                <div class="carousel-caption custom-caption">

                    <h1>WELCOME</h1>

                    <h2>TO OUR GARAGE</h2>

                    <p>We will make you love your car.</p>

                    <a href="#" class="btn btn-outline-light btn-lg">
                        OUR SERVICES
                    </a>

                </div>
            </div>

            <!-- Slide 2 -->

            <div class="carousel-item">

                <img src="./Assets/535956_902499463102064_1733450915833726045_n.jpg" class="d-block w-100 slider-img">

                <div class="overlay"></div>

                <div class="carousel-caption custom-caption">

                    <h1>CAR SERVICE</h1>

                    <h2>BEST QUALITY</h2>

                    <p>Professional mechanics for every vehicle.</p>

                    <a href="#" class="btn btn-outline-light btn-lg">
                        READ MORE
                    </a>

                </div>

            </div>

            <!-- Slide 3 -->

            <div class="carousel-item">

                <img src="./Assets/2011-Lamborghini-Gallardo-LP550-2-Spyder-Profile.jpg"
                    class="d-block w-100 slider-img">

                <div class="overlay"></div>

                <div class="carousel-caption custom-caption">

                    <h1>FAST REPAIR</h1>

                    <h2>24/7 SUPPORT</h2>

                    <p>Your trusted garage service center.</p>

                    <a href="#" class="btn btn-outline-light btn-lg">
                        CONTACT US
                    </a>

                </div>

            </div>

        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#garageSlider" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#garageSlider" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
